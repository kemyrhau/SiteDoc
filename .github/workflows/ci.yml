name: CI

# Trinn 1 (bevisst smalt): kjør tester på PR mot develop.
# Lint og WEB-typecheck er IKKE med — de har bred pre-eksisterende gjeld
# og føres som egen sak. En rød CI dag én blir ignorert.
#
# Unntak (lagt til 2026-08-28): MOBIL-typecheck ER med. Den ble ryddet grønn
# 2026-07-30 (`fba830da`) nettopp for å kunne blokkere, så gjelds-argumentet
# over gjelder ikke den. Regel 10 i SAMARBEIDSREGLER har krevd den før merge
# hele tiden og er blitt brutt gjentatte ganger — fordi regelen bare sto i et
# dokument noen måtte huske å lese. Her håndheves den av maskinen i stedet.
#
# Kjører både på pull_request og ved push til develop: merge-konvensjonen
# er `git push origin HEAD:develop` fra et merge-tre (uten PR), så uten
# push-triggeren ville kode som lander direkte aldri testes.
on:
  pull_request:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Leser pnpm-versjon fra "packageManager"-feltet i package.json (9.15.4)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Db-pakkene har ingen build-script, så turbos ^build genererer aldri
      # Prisma-klientene. Fersk checkout mangler dem → generer eksplisitt
      # før test, ellers feiler import av @sitedoc/db* i vitest.
      - name: Generer Prisma-klienter
        run: |
          pnpm --filter @sitedoc/db exec prisma generate
          pnpm --filter @sitedoc/db-timer exec prisma generate
          pnpm --filter @sitedoc/db-maskin exec prisma generate
          pnpm --filter @sitedoc/db-varelager exec prisma generate

      - run: pnpm test

      # Regel 10, mobil-halvdelen. `if: always()` fordi en rød test ellers ville
      # skjult en rød typecheck — vi vil se begge, ikke den første som feiler.
      # Forutsetter Prisma-klientene generert over: uten dem rapporterer tsc
      # 400+ falske «implicit any» fra ugenererte .prisma/*-client.
      - name: Mobil typecheck (regel 10)
        if: always()
        run: pnpm --filter @sitedoc/mobile typecheck
