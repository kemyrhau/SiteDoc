<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #6b7280; color: #111827; }
  </style>
</helmet>
<div style="width: 720px; height: 560px; box-sizing: border-box; padding: 40px; display: flex; align-items: flex-start; justify-content: center; background: #4b5563;">
  <div role="dialog" aria-labelledby="mt-tittel" style="width: 560px; background: #ffffff; border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <h2 id="mt-tittel" style="margin: 0; font-size: 18px; font-weight: 600;">Rediger mal: Varsel</h2>
      <button aria-label="Lukk" style="border: 0; background: transparent; font-size: 20px; color: #6b7280;">×</button>
    </div>
    <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #374151;">
      Navn
      <input value="Varsel" style="border: 1px solid #d1d5db; border-radius: 6px; padding: 8px 10px; font-size: 14px;">
    </label>
    <fieldset style="border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px;">
      <legend style="font-size: 13px; color: #374151; margin-bottom: 6px;">Type</legend>
      <sc-for list="{{typer}}" as="ty" hint-placeholder-count="2">
        <label style="{{ty.stil}}">
          <input type="radio" name="maltype" checked="{{ty.aktiv}}" onChange="{{ty.velg}}" style="margin-top: 3px;">
          <span style="display: flex; flex-direction: column; gap: 2px;">
            <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500;">
              <sc-if value="{{ty.ikon}}" hint-placeholder-val="{{false}}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg>
              </sc-if>
              {{ty.navn}}
            </span>
            <span style="font-size: 13px; color: #6b7280;">{{ty.forklaring}}</span>
          </span>
        </label>
      </sc-for>
    </fieldset>
    <sc-if value="{{visKonsekvens}}" hint-placeholder-val="{{true}}">
      <p style="margin: 0; font-size: 13px; color: #374151;">Gjelder også de 2 dokumentene som finnes fra denne malen. Tilgang og flyt endres ikke.</p>
    </sc-if>
    <div style="display: flex; justify-content: flex-end; gap: 8px;">
      <button style="background: #ffffff; border: 1px solid #d1d5db; border-radius: 6px; padding: 8px 14px; font-size: 14px;">Avbryt</button>
      <button style="background: #1e40af; color: #ffffff; border: 0; border-radius: 6px; padding: 8px 14px; font-size: 14px; font-weight: 500;">Lagre</button>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":720,"height":560}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { valgt: "kontrakt" };
  }
  renderVals() {
    const v = this.state.valgt;
    const liste = [
      { id: "oppgave", navn: "Oppgave", forklaring: "Arbeid som skal utføres, kontrolleres eller følges opp.", ikon: false },
      { id: "kontrakt", navn: "Kontraktssak", forklaring: "Varsel, krav eller svar etter kontrakten. Vises merket i Oppgaver.", ikon: true }
    ];
    const typer = liste.map((t) => ({
      ...t,
      aktiv: v === t.id,
      velg: () => this.setState({ valgt: t.id }),
      stil: "display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:8px;cursor:pointer;" +
        (v === t.id ? "border:1px solid #1e40af;background:#eff6ff;" : "border:1px solid #e5e7eb;background:#ffffff;")
    }));
    return { typer, visKonsekvens: v === "kontrakt" };
  }
}
</script>
</body>
</html>
