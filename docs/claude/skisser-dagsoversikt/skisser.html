    <div class="kol"><div class="steg graa">I dag (målt, L2 + L3-D2)</div>${oversiktIdag()}

      <div class="palett"><span style="background:#fef9c3"></span><span style="background:#fefce8;border-color:#fef08a"></span><span style="background:#ffedd5"></span><span style="background:#1e40af"></span><span style="background:#eff6ff"></span><span style="background:#2563eb"></span><span style="background:#f3f4f6"></span></div></div>
    </div>
    <div class="kol"><div class="steg">A — faste linjer pr. prosjekt <span class="anbefalt">ANBEFALT</span></div>${oversiktA()}
      <div class="forklar"><p>Ett kort pr. prosjekt med <b>alltid de samme linjene</b> i samme rekkefølge og typografi (sm 14 px, etikett grå): Arbeid · Maskin · Varer · Beskrivelse (+ Reise når ført). Tomt = «–», så det som mangler <i>synes som et hull</i>. Sum i dag øverst, én gang, i vanlig tekst.</p><p><b>Én farge:</b> amber prikk/venstrekant for «Ikke sendt», «Returnert» og «Mangler». Alt annet grått/svart. 2 skriftstørrelser i innholdet (sm + base navn).</p></div>
    </div>
    <div class="kol"><div class="steg">B — kvittering (verdi venstre, tall høyre)</div>${oversiktB()}
      <div class="forklar"><p>Samme data uten etiketter: hver registrering er én rad med tallet høyrestilt (tabular-nums). Kortere — bare det som er ført vises — men en tom kategori er <i>usynlig</i>; «mangler» må da sies med egen linje. Beskrivelsen i kursiv under en skillelinje.</p><p>Samme fargeregel som A.</p></div>
    </div>
  </div>
  <div class="fotnote">Toppbar og status-merke tilhører <code>app/timer/[id].tsx</code> (felles med dagskortet) og tegnes uendret — se spec § 5 (isolering). Overtidslinjen vises i begge; redigering eies av ORDRE 34.</div>`;
} else if (fig === "beskrivelse") {
  rot.innerHTML = `
  <h1>#10/11 «Hva gjorde du i dag?» i Bekreft dag — i dag · A · B</h1>
  <div class="rad">
    <div class="kol"><div class="steg graa">I dag (målt, L3-A + L3-D)</div>${bekreftIdag()}
      <div class="forklar"><p>Skjermen har <b>ingen beskrivelse</b>. <code>anvendDagsforslag</code> skriver aldri <code>beskrivelse</code>; feltet finnes bare i <code>TimerRadModal</code> på sedelen etterpå (3 klikk unna: kort → rad → felt).</p></div>
    </div>
    <div class="kol"><div class="steg">A — chips + felt, synlig i blokken <span class="anbefalt">ANBEFALT</span></div>${bekreftA(1)}
      <div class="forklar"><p><span class="nr">1</span>Ett trykk på et forslag fyller feltet (redigerbart). Forslag = de 2 sist brukte beskrivelsene dine på <i>dette prosjektet</i> + aktivitetsnavnet. Feltet står rett under arbeidstiden, alltid synlig: spørsmålet blir stilt uten at arbeideren må lete.</p><p>Klikk: forslag passer = <b>+1</b>; skrive selv = +1 (felt) + tekst + Ferdig.</p></div>
    </div>
    <div class="kol"><div class="steg">B — velgerrad → ark (som Prosjekt/Byggeplass)</div>${bekreftB(1)}
      <div class="forklar"><p><span class="nr">1</span>Raden åpner et ark; <span class="nr">2</span>velg sist brukt (lukker arket) eller skriv selv nederst. Samme mønster som Prosjekt/Byggeplass/Aktivitet over, og blokken holder seg kort. Men spørsmålet er gjemt bak en rad, og det billigste utfallet koster <b>+2</b>.</p></div>
    </div>
  </div>
  <div class="fotnote">Begge skriver til samme felt som prosjektkortet: <code>sheetTimerLocal.beskrivelse</code> på prosjektets arbeidsrad(er). Ved flere prosjekter (L4) får hvert prosjekt sitt felt under prosjektets første arbeidsblokk.</div>`;
}
document.body.dataset.klar = "1";
</script>
</body>
</html>
