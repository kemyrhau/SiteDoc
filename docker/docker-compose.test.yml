# NY-SERVER — sitedoc TEST-stack (staging på server-ny).
# Kjører ved siden av prod. Deler appnet + ML (embed/oversettelse) + postgres-containeren.
# DB: sitedoc_test. Domener: test.sitedoc.no (web 3300) + api-test.sitedoc.no (api 3301).
# Egne images (sitedoc-test-*) så prod-imagene står urørt.
# Forutsetter at prod-stacken (embed/oversettelse/postgres) kjører på 'appnet'.
# Bygg/kjør fra repo-rot:  sudo docker compose -f docker/docker-compose.test.yml up -d --build
name: sitedoc-test                     # eget prosjektnavn — skiller test fra prod (ingen orphan-advarsel / --remove-orphans-fare)
services:
  sitedoc-test-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      args:
        # Bygg-stempel: interpoleres fra ETT env-par som deles med web (se web-blokk).
        # Sett via `sudo GIT_SHA=$SHA BUILD_TID=$TID docker compose build`.
        # Tom fallback (:-) → lokal `docker compose build` uten stempel gir «dev»/«ukjent», ingen krasj.
        GIT_SHA: ${GIT_SHA:-}
        BUILD_TID: ${BUILD_TID:-}
    image: sitedoc-test-api:latest
    container_name: sitedoc-test-api
    restart: unless-stopped
    env_file:
      - ./env/felles.env               # delte secrets som MÅ være identiske i api+web (FIL_SIGNING_SECRET). Se DOCKER-NOTES § FIL_SIGNING_SECRET
      - ./env/api-test.env             # DATABASE_URL -> postgres:5432/sitedoc_test, AUTH_* (egen test), APP_URL=https://test.sitedoc.no ... (senere fil vinner ved kollisjon)
    environment:
      PORT: "3301"
      HOST: "0.0.0.0"
      NORBERT_URL: "http://embed:3302"             # deler prod sin embed (statsløs modell-server)
      OVERSETTELSE_URL: "http://oversettelse:3303" # deler prod sin oversettelse
      PDF_URL: "http://pdf-render:3304"            # deler prod sin pdf-render (arkivmal-konverter)
    ports:
      - "127.0.0.1:3301:3301"
      - "127.0.0.1:3300:3300"   # test-web lytter her (deler api sitt nett-namespace)
    networks: [appnet]
    volumes:
      - /home/kemyrhau/stack/sitedoc/uploads:/app/apps/api/uploads   # delt med prod (som gammel test-symlink) — test ser ekte filer
    security_opt: ["no-new-privileges:true"]

  sitedoc-test-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        API_PORT: "3301"   # bakes inn i Next-rewrite ved build (test-api lytter 3301, ikke default 3001)
        # Bygg-stempel: web-ARG-ene interpoleres fra SAMME env-par som api (GIT_SHA/BUILD_TID),
        # så api og web kan aldri stemples ulikt. Se api-blokk for kommandoen.
        NEXT_PUBLIC_BUILD_SHA: ${GIT_SHA:-}
        NEXT_PUBLIC_BUILD_TID: ${BUILD_TID:-}
    image: sitedoc-test-web:latest
    container_name: sitedoc-test-web
    restart: unless-stopped
    env_file:
      - ./env/felles.env               # delte secrets identiske i api+web (FIL_SIGNING_SECRET). tRPC/signering kjører i WEB → må stå her óg
      - ./env/web-test.env             # AUTH_* (egen test), AUTH_URL/NEXTAUTH_URL=https://test.sitedoc.no, DATABASE_URL (sitedoc_test) ...
    environment:
      PORT: "3300"
    # Read-only: web kjører tRPC in-process (arkivmal-sammenstillingen), og
    # `hentBildeBytesFraDisk` må LESE vedlegg fra disk. `:ro` gir lesetilgang
    # uten skriveflate. Arkiv-PDF skrives ikke til disk (vei 3b: retur i respons).
    volumes:
      - /home/kemyrhau/stack/sitedoc/uploads:/app/apps/web/uploads:ro
    network_mode: "service:sitedoc-test-api"
    depends_on: [sitedoc-test-api]
    security_opt: ["no-new-privileges:true"]

# embed / oversettelse / postgres bor i prod-compose (docker-compose.yml).
# test-api når dem via det delte, eksterne nettet 'appnet' på tjenestenavn.
networks:
  appnet:
    external: true
