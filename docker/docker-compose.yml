# NY-SERVER — sitedoc full-Docker stack (i prod fra 2026-06-10).
# Build-context = repo-rot (..). Postgres er den delte pgvector-containeren paa 'appnet' (egen compose).
# Kjor fra repo-rot:  sudo docker compose -f docker/docker-compose.yml up -d --build
name: sitedoc                          # eksplisitt prosjektnavn (skiller prod fra test-stacken)
services:
  sitedoc-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      args:
        # Bygg-stempel: interpoleres fra ETT env-par som deles med web (se web-blokk).
        # Sett via `sudo GIT_SHA=$SHA BUILD_TID=$TID docker compose build`.
        # Tom fallback (:-) → lokal `docker compose build` uten stempel gir «dev»/«ukjent», ingen krasj.
        GIT_SHA: ${GIT_SHA:-}
        BUILD_TID: ${BUILD_TID:-}
    image: sitedoc-api:latest
    container_name: sitedoc-api
    restart: unless-stopped
    env_file:
      - ./env/felles.env               # delte secrets som MÅ være identiske i api+web (FIL_SIGNING_SECRET). Se DOCKER-NOTES § FIL_SIGNING_SECRET
      - ./env/api.env                  # se DOCKER-NOTES.md (DATABASE_URL -> postgres:5432, AUTH_*, RESEND, VEGVESEN ...) (senere fil vinner ved kollisjon)
    environment:
      PORT: "3001"
      HOST: "0.0.0.0"
      NORBERT_URL: "http://embed:3302"
      OVERSETTELSE_URL: "http://oversettelse:3303"   # env-navn verifisert mot oversettelse-service.ts:11
      PDF_URL: "http://pdf-render:3304"              # arkivmal HTML→PDF-konverter (Stage 4a)
    ports:
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:3100:3100"   # web lytter her (deler api sitt nett-namespace)
    networks: [appnet]
    volumes:
      - /home/kemyrhau/stack/sitedoc/uploads:/app/apps/api/uploads
    depends_on: [embed, oversettelse, pdf-render]
    security_opt: ["no-new-privileges:true"]

  sitedoc-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        API_PORT: "3001"   # bakes inn i Next-rewrite ved build (= default; eksplisitt for symmetri med test)
        # Bygg-stempel: web-ARG-ene interpoleres fra SAMME env-par som api (GIT_SHA/BUILD_TID),
        # så api og web kan aldri stemples ulikt. Se api-blokk for kommandoen.
        NEXT_PUBLIC_BUILD_SHA: ${GIT_SHA:-}
        NEXT_PUBLIC_BUILD_TID: ${BUILD_TID:-}
    image: sitedoc-web:latest
    container_name: sitedoc-web
    restart: unless-stopped
    env_file:
      - ./env/felles.env               # delte secrets identiske i api+web (FIL_SIGNING_SECRET). tRPC/signering kjører i WEB → må stå her óg
      - ./env/web.env                  # AUTH_SECRET, AUTH_GOOGLE_*, AUTH_MICROSOFT_*, DATABASE_URL, RESEND ...
    environment:
      PORT: "3100"
    # Read-only: web kjører tRPC in-process (arkivmal-sammenstillingen), og
    # `hentBildeBytesFraDisk` må LESE vedlegg fra disk. `:ro` gir lesetilgang
    # uten at den eksponerte flaten kan skrive brukerdata. Arkiv-PDF skrives
    # ikke lenger til disk (vei 3b: returneres i responsen).
    volumes:
      - /home/kemyrhau/stack/sitedoc/uploads:/app/apps/web/uploads:ro
    network_mode: "service:sitedoc-api"
    depends_on: [sitedoc-api]
    security_opt: ["no-new-privileges:true"]

  embed:
    build: { context: .., dockerfile: docker/Dockerfile.ml }
    image: sitedoc-ml:latest
    container_name: sitedoc-embed
    restart: unless-stopped
    command: ["python", "norbert-server.py"]
    environment: { NORBERT_PORT: "3302", NORBERT_HOST: "0.0.0.0" }   # bind 0.0.0.0 for cross-container-tilgang fra api
    networks: [appnet]
    volumes: ["ml_models:/models"]

  oversettelse:
    image: sitedoc-ml:latest            # gjenbruker image bygget av 'embed'
    container_name: sitedoc-oversettelse
    restart: unless-stopped
    command: ["python", "oversettelse-server.py"]
    networks: [appnet]
    volumes: ["ml_models:/models"]
    depends_on: [embed]

  # Arkivmal HTML→PDF-konverter (Stage 4a). Ren konverter: ingen DB, ingen
  # FIL_SIGNING_SECRET (bilder inlinet av api, levering av api). Egen Chromium-base.
  pdf-render:
    build:
      context: ..
      dockerfile: docker/Dockerfile.pdf
      args:
        GIT_SHA: ${GIT_SHA:-}
        BUILD_TID: ${BUILD_TID:-}
    image: sitedoc-pdf-render:latest
    container_name: sitedoc-pdf-render
    restart: unless-stopped
    environment: { PORT: "3304", HOST: "0.0.0.0" }   # internt på appnet, ingen host-port
    networks: [appnet]
    security_opt: ["no-new-privileges:true"]

networks:
  appnet:
    external: true

volumes:
  ml_models:
